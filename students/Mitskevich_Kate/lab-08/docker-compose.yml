version: '3.8'

services:
  # ============================================
  # API Gateway
  # ============================================
  api-gateway:
    image: nginx:alpine
    container_name: money_api_gateway
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transaction-service
      - category-service
      - report-service
    networks:
      - money_network
    restart: unless-stopped

  # ============================================
  # Transaction Service
  # ============================================
  transaction-service:
    build: ./services/transaction_service
    container_name: money_transaction_service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@transactions-db:5432/transactions_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      transactions-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - money_network
    restart: unless-stopped

  transactions-db:
    image: postgres:15-alpine
    container_name: money_transactions_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: transactions_db
    ports:
      - "5432:5432"
    volumes:
      - transactions-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money_network

  # ============================================
  # Category Service
  # ============================================
  category-service:
    build: ./services/category_service
    container_name: money_category_service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@categories-db:5432/categories_db
      RABBITMQ_HOST: rabbitmq
    depends_on:
      categories-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - money_network
    restart: unless-stopped

  categories-db:
    image: postgres:15-alpine
    container_name: money_categories_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: categories_db
    volumes:
      - categories-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money_network

  # ============================================
  # Report Service
  # ============================================
  report-service:
    build: ./services/report_service
    container_name: money_report_service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@reports-db:5432/reports_db
    depends_on:
      reports-db:
        condition: service_healthy
    networks:
      - money_network
    restart: unless-stopped

  reports-db:
    image: postgres:15-alpine
    container_name: money_reports_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reports_db
    volumes:
      - reports-data:/var/lib/postgresql/data
      - ./sql/materialized_views.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money_network

  # ============================================
  # Notification Service
  # ============================================
  notification-service:
    build: ./services/notification_service
    container_name: money_notification_service
    ports:
      - "8004:8000"
    environment:
      RABBITMQ_HOST: rabbitmq
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - money_network
    restart: unless-stopped

  # ============================================
  # Message Broker (RabbitMQ)
  # ============================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: money_rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - money_network
    restart: unless-stopped

  # ============================================
  # Redis (Cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: money_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - money_network
    restart: unless-stopped

networks:
  money_network:
    driver: bridge

volumes:
  transactions-data:
  categories-data:
  reports-data:
  rabbitmq-data:
  redis-data: