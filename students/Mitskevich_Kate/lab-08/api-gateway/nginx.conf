events {
    worker_connections 1024;
}

http {
    upstream transaction_service {
        server transaction-service:8001;
        keepalive 32;
    }
    
    upstream category_service {
        server category-service:8002;
        keepalive 32;
    }
    
    upstream report_service {
        server report-service:8003;
        keepalive 32;
    }
    
    upstream notification_service {
        server notification-service:8004;
        keepalive 32;
    }
    
    # Circuit Breaker имитация через proxy_next_upstream
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
    
    server {
        listen 80;
        server_name localhost;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Idempotency-Key' always;
        
        # Health check endpoint
        location /health {
            return 200 '{"status": "healthy"}';
            add_header Content-Type application/json;
        }
        
        # API Version
        location /api/v1/ {
            rewrite ^/api/v1/(.*)$ /$1 break;
            
            # Маршрутизация на Transaction Service
            location ~ ^/transactions {
                proxy_pass http://transaction_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Request-ID $request_id;
                
                # Timeouts
                proxy_connect_timeout 5s;
                proxy_send_timeout 10s;
                proxy_read_timeout 10s;
            }
            
            # Маршрутизация на Category Service
            location ~ ^/categories {
                proxy_pass http://category_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            
            # Маршрутизация на Report Service
            location ~ ^/reports {
                proxy_pass http://report_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
            
            # Маршрутизация на Notification Service
            location ~ ^/notifications {
                proxy_pass http://notification_service;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
        
        # Rate limiting (50 запросов в минуту)
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/m;
        limit_req zone=api_limit burst=10 nodelay;
        
        # Логирование
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}